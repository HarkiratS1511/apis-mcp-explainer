<!doctype html>

<title>APIs and MCP, explained</title>
<meta name="description" content="An interactive, plain-words explainer of APIs and MCP (Model Context Protocol), and how AI plugs into your other apps. A teaching demo by Ritesh &amp; Harkirat.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ===================================================================
   1. TOKENS (Dragonfly Thinking brand kit, verbatim) + fluid tokens
   =================================================================== */
:root {
  --dragonfly: #0563fa;
  --dragonfly-dark: #0e2841;
  --dragonfly-light: #c9e6ff;
  --cobalt: #002d9c;
  --ink: #18181b;
  --ink-heading: #1d293d;
  --ink-strong: #314158;
  --ink-secondary: #52525c;
  --ink-label: #45556c;
  --ink-muted: #71717a;
  --ink-on-dark: #fafafa;
  --ink-on-dark-muted: #d4d4d8;
  --surface: #fafafa;
  --surface-page: #f8fafc;
  --surface-card: #ffffff;
  --surface-muted: #f4f4f5;
  --surface-inverse: #0f172a;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --ring: #a1a1aa;
  --logo-ink: #2e2b2d;
  --logo-ink-reversed: #ededec;
  --gradient-1: #002d9c;
  --gradient-2: #1d4ed8;
  --gradient-3: #0563f4;
  --gradient-4: #92448a;
  --gradient-5: #da342a;
  --gradient-6: #8b1a14;
  --lens-tech: #3b82f6;
  --lens-geo: #0ea5e9;
  --lens-systems: #10b981;
  --lens-business: #f97316;
  --lens-scenario: #9b4dca;
  --lens-risk: #dc2626;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-14: 56px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;
  --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-display-alt: "Instrument Serif", "IBM Plex Serif", Georgia, serif;
  --gradient-headline: linear-gradient(90deg, #002d9c 0%, #1d4ed8 22%, #0563f4 42%, #92448a 62%, #da342a 82%, #8b1a14 100%);

  /* Fluid type (projector first, phone last) */
  --fs-display: clamp(48px, 6.4vw, 104px);
  --fs-h2: clamp(36px, 4.2vw, 64px);
  --fs-h3: clamp(26px, 2.4vw, 36px);
  --fs-lead: clamp(22px, 1.7vw, 30px);
  --fs-body: clamp(20px, 1.25vw, 24px);
  --fs-label: clamp(16px, 0.95vw, 18px);
  --fs-ui: clamp(18px, 1.1vw, 20px);

  /* Motion */
  --dur-1: 200ms;
  --dur-2: 450ms;
  --dur-3: 800ms;
  --ease: cubic-bezier(.2, .7, .2, 1);

  /* Layout */
  --bar-h: 64px;
  --header-h: 64px;
  --gutter: clamp(16px, 3.5vw, 48px);
  --slide-pad: clamp(56px, 8vh, 112px);
}
@media (max-width: 639px) { :root { --bar-h: 56px; } }
@media (prefers-reduced-motion: reduce) {
  :root { --dur-1: 1ms; --dur-2: 1ms; --dur-3: 1ms; }
}

/* ===================================================================
   2. BASE
   =================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-bottom: var(--bar-h); }
body {
  margin: 0;
  background: var(--surface-page);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.55;
  font-weight: 400;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
p { margin: 0; max-width: 60ch; }
ul, ol { margin: 0; padding: 0; }
b, strong { font-weight: 600; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; }
button, [role="switch"], a, .pbar, summary, select { touch-action: manipulation; }
a { color: var(--dragonfly); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
::selection { background: var(--dragonfly-light); color: var(--ink); }

h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: 400;
  letter-spacing: -0.025em;
  color: var(--ink-heading);
  line-height: 1.12;
  text-wrap: balance;
}
h1, .h-display { font-size: var(--fs-display); line-height: 1.04; max-width: 18ch; }
h2, .h2 { font-size: var(--fs-h2); line-height: 1.08; max-width: 24ch; margin-bottom: clamp(20px, 3vh, 32px); }
h3, .h3 { font-size: var(--fs-h3); line-height: 1.18; max-width: 30ch; }
/* Headings take focus after a presenter jump; a ring on a heading is only noise on a projector. */
:is(h1, h2, h3, h4, section, main)[tabindex="-1"]:focus { outline: none; }

:focus-visible { outline: 3px solid var(--dragonfly); outline-offset: 3px; }
.slide--navy :focus-visible:not(:is(.card, .panel, .callout) *) { outline-color: var(--dragonfly-light); }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
.skip-link {
  position: absolute; left: 16px; top: -100px; z-index: 100;
  background: var(--ink); color: var(--ink-on-dark); padding: 14px 24px; border-radius: var(--radius-md);
  font: 500 var(--fs-ui)/1.25 var(--font-sans); text-decoration: none;
}
.skip-link:focus { top: 16px; }

.icon {
  width: 1em; height: 1em; flex: none; vertical-align: -0.125em;
  fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.icon--lg { width: 1.5em; height: 1.5em; }

/* ===================================================================
   3. LAYOUT
   =================================================================== */
.wrap { width: 100%; max-width: calc(1240px + 2 * var(--gutter)); margin-inline: auto; padding-inline: var(--gutter); }
.narrow { max-width: 60ch; }

.slide {
  position: relative;
  min-height: calc(100vh - var(--bar-h));
  min-height: calc(100svh - var(--bar-h));
  padding-top: clamp(56px, 10vh, 120px);
  padding-bottom: max(var(--slide-pad), calc(var(--bar-h) + 8px));
  display: flex; flex-direction: column; justify-content: flex-start;
  background: var(--surface-page);
}
/* Content sections are top-anchored so every .secnum sits at the same height. Openers, hero and the big moments centre. */
.slide--center { justify-content: center; padding-top: var(--slide-pad); }
.slide + .slide { border-top: 1px solid var(--border); }
.slide > .wrap { position: relative; z-index: 1; }

.slide--navy { background: var(--dragonfly-dark); color: var(--ink-on-dark); }
.slide--sky { background: var(--dragonfly-light); color: var(--ink); }
.slide.slide--navy, .slide.slide--sky, .slide--navy + .slide, .slide--sky + .slide { border-top: 0; }
/* Navy recolouring never reaches inside .card/.panel/.callout: those are light-ground islands. */
.slide--navy :is(h1, h2, h3, h4):not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark); }
.slide--navy a:not(.btn):not(.replay):not(.btn-reset):not(:is(.card, .panel, .callout) *) { color: var(--dragonfly-light); }
.slide--sky a:not(.btn):not(.replay):not(.btn-reset) { color: var(--cobalt); }

.split { display: grid; gap: clamp(32px, 4vw, 72px); align-items: start; }
.split > * { min-width: 0; }
@media (min-width: 1024px) { .split { grid-template-columns: 5fr 7fr; } }

.stack { --stack: 24px; }
.stack-lg { --stack: clamp(28px, 4vh, 48px); }
.stack > * + *, .stack-lg > * + * { margin-top: var(--stack); }

/* Decorative compound-eye dot lattice. Put <div class="facets" aria-hidden="true"></div> first in a slide.
   Confined to the right 40% of the slide, fading out to the left, and hidden on phones, so it never sits under text. */
.facets {
  --facet: var(--border-strong);
  position: absolute; top: 0; bottom: 0; right: 0; left: 60%; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 50% 50%, var(--facet) 0 1.6px, transparent 2.6px),
    radial-gradient(circle at 50% 50%, var(--facet) 0 1.6px, transparent 2.6px);
  background-size: 44px 76px;
  background-position: 0 0, 22px 38px;
  -webkit-mask-image: linear-gradient(to left, #000 0%, rgba(0, 0, 0, 0) 100%);
  mask-image: linear-gradient(to left, #000 0%, rgba(0, 0, 0, 0) 100%);
}
.slide--navy .facets { --facet: var(--dragonfly-light); opacity: 0.2; }
@media (max-width: 639px) { .facets { display: none; } }

/* ===================================================================
   4. TYPE
   =================================================================== */
.eyebrow {
  margin: 0; font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 600;
  line-height: 1.4; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dragonfly);
}
.slide--navy .eyebrow:not(:is(.card, .panel, .callout) *) { color: var(--dragonfly-light); }
.slide--sky .eyebrow { color: var(--cobalt); }

.secnum {
  display: flex; gap: 14px; align-items: baseline; margin: 0;
  font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 600;
  line-height: 1.4; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-label);
}
.secnum b { font-weight: 600; color: var(--dragonfly); }
.slide--navy .secnum:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark-muted); }
.slide--navy .secnum:not(:is(.card, .panel, .callout) *) b { color: var(--dragonfly-light); }
.slide--sky .secnum b { color: var(--cobalt); }

.lead { text-wrap: balance; font-size: var(--fs-lead); line-height: 1.45; color: var(--ink-heading); max-width: 52ch; }
.slide--navy .lead:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark-muted); }
.mono-note { font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 500; line-height: 1.5; letter-spacing: 0.02em; color: var(--ink-label); }
.slide--navy .mono-note:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark-muted); }
/* .note: small notes and captions in plain sans (mono is for short UPPERCASE labels only). .mono-note is deprecated. */
.note { font-family: var(--font-sans); font-weight: 400; font-size: var(--fs-ui); line-height: 1.5; color: var(--ink-label); max-width: 60ch; }
.slide--navy .note:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark-muted); }
/* .keyline: the one takeaway sentence of a section. */
.keyline { font-family: var(--font-serif); font-weight: 400; font-size: var(--fs-lead); line-height: 1.3; letter-spacing: -0.015em; color: var(--ink-heading); max-width: 40ch; text-align: left; text-wrap: balance; }
.slide--navy .keyline:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark); }

/* Gradient italic phrase: hero and section 12 only (contract). */
.grad {
  display: inline-block; font-style: italic; font-weight: 400;
  padding: 0 0.08em 0.14em 0; margin-bottom: -0.14em;
  background: var(--gradient-headline); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

/* Everyday word big, tech word small beside it */
.term { display: block; }
.term__word { font-family: var(--font-serif); font-size: var(--fs-h3); line-height: 1.15; letter-spacing: -0.025em; color: var(--ink-heading); max-width: none; }
.term__tech {
  margin-top: 6px; font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 600;
  line-height: 1.4; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dragonfly); max-width: none;
}
.slide--navy .term__word:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark); }
.slide--navy .term__tech:not(:is(.card, .panel, .callout) *) { color: var(--dragonfly-light); }
.slide--sky .term__tech { color: var(--cobalt); }

/* ===================================================================
   5. BUTTONS AND CONTROLS
   =================================================================== */
.btn, .replay, .btn-reset {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  min-height: 56px; padding: 14px 28px;
  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: 500; line-height: 1.25; text-align: center;
  color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: var(--radius-md);
  cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.btn .icon { transition: transform var(--dur-1) var(--ease); }

.btn--primary { background: var(--ink); color: var(--ink-on-dark); }
.btn--secondary, .replay, .btn-reset { background: var(--surface-card); color: var(--ink); border-color: var(--ink-muted); }
.btn--on-dark { background: var(--ink-on-dark); color: var(--ink); }
.btn--small { min-height: 48px; padding: 10px 20px; }
.replay, .btn-reset { padding: 14px 24px; }

.btn--choice { position: relative; background: var(--surface-card); color: var(--ink); border: 2px solid var(--ink-muted); padding-inline: 46px; }
.btn--choice[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-muted); }
.btn__check { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0; width: 1.1em; height: 1.1em; stroke-width: 2; transition: opacity var(--dur-1) var(--ease); }
.btn--choice[aria-pressed="true"] .btn__check { opacity: 1; }

/* Navy slides: ink buttons would vanish, so outside cards they flip to light (cards keep the light-ground look) */
.slide--navy .btn--primary:not(:is(.card, .panel, .callout) *) { background: var(--ink-on-dark); color: var(--ink); }
.slide--navy .btn--secondary:not(:is(.card, .panel, .callout) *), .slide--navy .replay:not(:is(.card, .panel, .callout) *), .slide--navy .btn-reset:not(:is(.card, .panel, .callout) *) { background: transparent; color: var(--ink-on-dark); border-color: var(--ink-on-dark-muted); }

/* Hover and active apply only to enabled buttons */
.btn:not([disabled]):not([aria-disabled="true"]):active, .replay:not([disabled]):active, .btn-reset:not([disabled]):active { transform: translateY(1px); }
.btn:not([disabled]):not([aria-disabled="true"]):hover .icon:last-child:not(.btn__check) { transform: translateX(3px); }
.btn--primary:not([disabled]):not([aria-disabled="true"]):hover { background: var(--ink-strong); }
.btn--primary:not([disabled]):not([aria-disabled="true"]):active { background: var(--surface-inverse); }
.btn--secondary:not([disabled]):not([aria-disabled="true"]):hover, .replay:not([disabled]):hover, .btn-reset:not([disabled]):hover { background: var(--surface-muted); border-color: var(--ink); }
.btn--secondary:not([disabled]):not([aria-disabled="true"]):active, .replay:not([disabled]):active, .btn-reset:not([disabled]):active { background: var(--border); }
.btn--on-dark:not([disabled]):not([aria-disabled="true"]):hover { background: var(--dragonfly-light); }
.btn--on-dark:not([disabled]):not([aria-disabled="true"]):active { background: var(--ink-on-dark-muted); }
.btn--choice:not([disabled]):not([aria-disabled="true"]):hover { background: var(--surface-muted); border-color: var(--ink); }
.slide--navy .btn--primary:not(:is(.card, .panel, .callout) *):not([disabled]):not([aria-disabled="true"]):hover { background: var(--dragonfly-light); }
.slide--navy .btn--secondary:not(:is(.card, .panel, .callout) *):not([disabled]):not([aria-disabled="true"]):hover, .slide--navy .replay:not(:is(.card, .panel, .callout) *):not([disabled]):hover, .slide--navy .btn-reset:not(:is(.card, .panel, .callout) *):not([disabled]):hover { background: var(--dragonfly-dark); border-color: var(--ink-on-dark); }

/* Disabled stays legible (muted fill, dark grey text) and wins over every variant above */
.slide .btn[disabled], .slide .btn[aria-disabled="true"], .slide .replay[disabled], .slide .btn-reset[disabled],
.btn[disabled], .btn[aria-disabled="true"], .replay[disabled], .btn-reset[disabled] {
  cursor: not-allowed; background: var(--surface-muted); color: var(--ink-secondary); border-color: var(--border); transform: none;
}

.btn-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Switch: thumb position AND the words On/Off carry state */
.switch {
  display: inline-flex; align-items: center; gap: 16px; min-height: 56px; padding: 4px 0;
  background: none; border: 0; border-radius: var(--radius-md); cursor: pointer; text-align: left;
  font-family: var(--font-sans); font-size: var(--fs-ui); font-weight: 500; line-height: 1.25; color: var(--ink);
}
.switch__track {
  position: relative; flex: none; width: 96px; height: 44px; border-radius: var(--radius-full);
  background: var(--surface-muted); border: 2px solid var(--ink-muted);
  display: flex; align-items: center; justify-content: flex-end; padding-inline: 12px;
  font-family: var(--font-mono); font-size: 16px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-label);
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.switch__track::after { content: "Off"; content: "Off" / ""; }
.switch__thumb {
  position: absolute; top: 3px; left: 3px; width: 34px; height: 34px; border-radius: var(--radius-full);
  background: var(--surface-card); border: 2px solid var(--ink-label);
  transition: transform var(--dur-2) var(--ease);
}
.switch:hover .switch__track { border-color: var(--ink); }
.switch[aria-checked="true"] .switch__track { background: var(--ink); border-color: var(--ink); color: var(--ink-on-dark); justify-content: flex-start; }
.switch[aria-checked="true"] .switch__track::after { content: "On"; content: "On" / ""; }
.switch[aria-checked="true"] .switch__thumb { transform: translateX(52px); border-color: var(--ink-on-dark); }
.slide--navy .switch:not(:is(.card, .panel, .callout) *) { color: var(--ink-on-dark); }

/* ===================================================================
   6. SURFACES
   =================================================================== */
.card, .panel, .callout, .result { position: relative; }
.card { --card-pad: clamp(20px, 2vw, 32px); background: var(--surface-card); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--card-pad); }
.card--active { border: 2px solid var(--dragonfly); padding: calc(var(--card-pad) - 1px); }
.panel { background: var(--surface-muted); color: var(--ink); border-radius: var(--radius-lg); padding: clamp(20px, 2vw, 32px); }
.callout { background: var(--surface-muted); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: clamp(20px, 2vw, 28px); }
.callout > * + * { margin-top: 10px; }
.callout__kicker { font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.4; color: var(--ink-label); }
.callout--warn { background: var(--surface-card); border-color: var(--lens-risk); }
.callout--warn .callout__kicker { color: var(--lens-risk); }
/* Tag placement: top-right corner of a panel/card (.tag--corner) or directly under the heading. */
.tagged { position: relative; }
.tag--corner { position: absolute; top: 12px; right: 12px; z-index: 2; }
:is(.card, .panel, .callout):has(> .tag--corner) { padding-top: 56px; }
.result { display: flex; gap: 16px; align-items: flex-start; background: var(--surface-muted); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: clamp(16px, 1.6vw, 24px); }
.result[hidden] { display: none; }
.result > * { min-width: 0; }
.result p { max-width: none; }
.result__icon { margin-top: 0.1em; }
.result--ok .result__icon { color: var(--dragonfly); }
.result--warn { background: var(--surface-card); border-color: var(--lens-risk); }
.result--warn .result__icon { color: var(--lens-risk); }
.full { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(24px, 3vw, 40px); }
.full > * { min-width: 0; }
.tag {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--surface-card); color: var(--ink-label);
  border: 1px solid var(--border-strong); border-radius: var(--radius-full);
  font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 600; line-height: 1.4; letter-spacing: 0.12em; text-transform: uppercase;
}

/* ===================================================================
   7. HEADER, FOOTER, PRESENTER BAR
   =================================================================== */
.site-header { height: var(--header-h); background: var(--surface-page); }
.site-header__in, .site-footer__in { display: flex; align-items: center; gap: 14px; }
.site-header__in { height: 100%; }
.site-footer__mark { display: block; flex: none; height: 28px; width: 17px; }
.site-footer__mark path { fill: var(--logo-ink-reversed); }
.site-header img, .site-footer img { display: block; height: 28px; width: auto; }
.site-header__label { font-family: var(--font-mono); font-size: var(--fs-label); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-label); }
.site-footer { border-top: 0; padding: 40px 0 calc(var(--bar-h) + 48px); background: var(--dragonfly-dark); color: var(--ink-on-dark); }
.site-footer__in { flex-wrap: wrap; row-gap: 8px; column-gap: 14px; }
.site-footer p { font-size: var(--fs-ui); max-width: none; color: var(--ink-on-dark); }
.site-footer p.note { margin-left: auto; color: var(--ink-on-dark-muted); }
@media (max-width: 639px) { .site-footer p.note { margin-left: 0; flex-basis: 100%; } }

.pbar {
  --pbar-fs: clamp(16px, 0.95vw, 18px);
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: var(--bar-h);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px;
  padding-inline: clamp(8px, 2vw, 24px);
  background: var(--surface-card); border-top: 1px solid var(--border);
}
.pbar[hidden] { display: none; }
.pbar :focus-visible { outline-offset: -3px; }
.pbar__btn {
  display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; cursor: pointer;
  background: var(--surface-card); color: var(--ink); border: 1px solid var(--ink-muted); border-radius: var(--radius-md);
  font-size: 22px; transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.pbar__btn:hover { background: var(--surface-muted); border-color: var(--ink); }
.pbar__btn:active { background: var(--border); }
.pbar__btn[aria-disabled="true"], .pbar__btn[aria-disabled="true"]:hover { color: var(--ink-secondary); background: var(--surface-muted); border-color: var(--border); cursor: default; }
.pbar__parts { display: flex; justify-content: center; align-items: center; gap: clamp(8px, 2.5vw, 40px); min-width: 0; }
.pbar__seg {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-height: 48px; padding: 4px 12px; background: none; border: 0; border-radius: var(--radius-md); cursor: pointer;
}
.pbar__seg:hover { background: var(--surface-muted); }
.pbar__label, .pbar__now { font-family: var(--font-sans); font-size: var(--pbar-fs); font-weight: 500; line-height: 1.2; color: var(--ink-label); white-space: nowrap; }
.pbar__seg[aria-current="true"] .pbar__label { color: var(--ink); font-weight: 600; }
.pbar__ticks { display: flex; gap: 3px; align-items: center; height: 8px; }
.pbar__tick { width: 12px; height: 4px; border-radius: 2px; background: var(--border-strong); }
.pbar__tick.is-visited { background: var(--dragonfly); }
.pbar__tick.is-current { background: var(--dragonfly); height: 8px; }
.pbar__now { display: none; color: var(--ink); font-weight: 600; text-align: center; overflow: hidden; text-overflow: ellipsis; }
.pbar__right { display: flex; align-items: center; gap: 12px; }
.pbar__count { font-family: var(--font-mono); font-size: var(--pbar-fs); font-weight: 600; color: var(--ink); white-space: nowrap; }
@media (max-width: 899px) {
  .pbar__tick { width: 7px; }
  .pbar__ticks { gap: 2px; }
  .pbar__seg { padding-inline: 8px; }
  .pbar__parts { gap: 8px; }
}
@media (max-width: 639px) {
  .pbar { column-gap: 8px; padding-inline: 8px; }
  .pbar__parts { display: none; }
  .pbar__now { display: block; grid-column: 2; grid-row: 1; }
  .pbar__right { gap: 8px; }
}

    countSr.textContent = c.sr;
    var cp = partOf(secs[current]);
    nowEl.textContent = cp && segs[cp] ? segs[cp].label : labelOf(current);
    PARTS.forEach(function (p) {
      var s = segs[p.key]; if (!s) return;
      if (p.key === cp) s.btn.setAttribute('aria-current', 'true'); else s.btn.removeAttribute('aria-current');
      s.ticks.forEach(function (t) {
        t.el.className = 'pbar__tick' + (t.idx === current ? ' is-current' : (visited[t.idx] ? ' is-visited' : ''));
      });
    });
    var first = current === 0, last = current === secs.length - 1;
    prevBtn.setAttribute('aria-disabled', first ? 'true' : 'false');
    nextBtn.setAttribute('aria-disabled', last ? 'true' : 'false');
    prevBtn.setAttribute('aria-label', first ? 'Previous section (this is the first)' : 'Previous: ' + labelOf(current - 1));
    nextBtn.setAttribute('aria-label', last ? 'Next section (this is the last)' : 'Next: ' + labelOf(current + 1));
  }

  /* A section counts as visited only after a short dwell, not when scrolled past. */
  function scheduleVisit() {
    clearTimeout(dwellT);
    dwellT = setTimeout(function () { if (!jumping) { visited[current] = true; render(); } }, 600);
  }
  /* Keep the URL hash in step with the current section without adding history entries. */
  function scheduleHash() {
    clearTimeout(hashT);
    hashT = setTimeout(function () {
      if (jumping) return;
      try {
        var id = secs[current].id;
        var want = current === 0 ? '' : '#' + id;
        if (location.hash !== want) history.replaceState(null, '', location.pathname + location.search + want);
      } catch (e) { /* file or sandboxed contexts */ }
    }, 350);
  }
  function remember() { anchorIdx = current; anchorOff = window.scrollY - absTop(secs[current]); }

  var raf = 0;
  function update() {
    if (jumping) return;           // the jump owns `current` until it settles
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      if (jumping) return;
      var c = measure();
      if (c !== current) { current = c; scheduleVisit(); }
      render();
      if (!resizing) { remember(); scheduleHash(); }   // a resize reflows sections; keep the anchor from before it
    });
  }

  /* ---- jumping ---- */
  function settle() {
    if (Math.abs(window.scrollY - destY) > 3 && Date.now() - jumpStart < 2500) { armSettle(); return; }
    jumping = false; DT._jumping = false; navTarget = null;
    current = measure();
    render(); remember(); scheduleVisit(); scheduleHash();
    document.dispatchEvent(new Event('dt:settle'));
  }
  function armSettle() { clearTimeout(settleT); settleT = setTimeout(settle, 200); }
  function endJump() {          // the person took over with wheel, touch or mouse
    if (!jumping) return;
    clearTimeout(settleT);
    jumping = false; DT._jumping = false; navTarget = null;
    document.dispatchEvent(new Event('dt:settle'));
    update();
  }
  /* from/to are section indexes; dt:jump carries their ids (from === to when scrolling inside one tall section). */
  function scrollToY(y, instant, from, to) {
    y = Math.max(0, Math.min(maxY(), y));
    destY = y;
    if (!jumping) jumpStart = Date.now();
    jumping = true; DT._jumping = true;
    if (from === undefined) from = to = current;
    document.dispatchEvent(new CustomEvent('dt:jump', { detail: { from: secs[from].id, to: secs[to].id } }));
    clearTimeout(dwellT);
    window.scrollTo({ top: y, behavior: (instant || DT.reduced) ? 'auto' : 'smooth' });
    armSettle();
  }
  function focusHeading(sec) {
    var id = (sec.getAttribute('aria-labelledby') || '').split(/\s+/)[0];
    var h = id ? sec.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape(id) : id)) : null;
    h = h || sec.querySelector('h1, h2') || sec;
    if (!h.hasAttribute('tabindex')) h.setAttribute('tabindex', '-1');
    try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); }
  }
  /* opts: focus ('heading' | false), announce (true), instant (true) */
  function goTo(i, opts) {
    opts = opts || {};
    i = Math.max(0, Math.min(secs.length - 1, i));
    var sec = secs[i], from = current;
    navTarget = i; current = i;
    scrollToY(i === 0 ? 0 : absTop(sec), opts.instant, from, i);
    if (opts.focus === 'heading') focusHeading(sec);
    if (opts.announce) {
      var c = counterOf(i);
      DT.announce(nums[i] !== null ? c.sr + ': ' + labelOf(i) : labelOf(i));
    }
    render();
  }
  /* how: 'key' (may scroll within tall sections, moves focus to the heading) or 'button' (jumps by section) */
  function step(d, how, kbd) {
    var base = jumping && navTarget !== null ? navTarget : current;
    if (how === 'key' && window.innerWidth >= 1024) {
      var y = jumping ? destY : window.scrollY;
      var usable = window.innerHeight - barH();
      var sec = secs[base];
      var pb = parseFloat(getComputedStyle(sec).paddingBottom) || 0;   // the slide's bottom padding is air, not content
      var top = base === 0 ? 0 : absTop(sec), bottom = absTop(sec) + sec.offsetHeight - pb;
      var tall = sec.offsetHeight - pb > usable + 24;   // only sections taller than the screen scroll in steps
      if (tall && d > 0 && bottom - (y + usable) > 24) { navTarget = base; scrollToY(Math.min(y + 0.85 * usable, bottom - usable)); return true; }
      if (tall && d < 0 && y - top > 24) { navTarget = base; scrollToY(Math.max(y - 0.85 * usable, top)); return true; }
    }
    var t = base + d;
    if (t < 0 || t > secs.length - 1) return false;
    goTo(t, (how === 'key' || kbd) ? { focus: 'heading' } : { focus: false, announce: true });
    return true;
  }

  prevBtn.addEventListener('click', function (e) { step(-1, 'button', e.detail === 0); });
  nextBtn.addEventListener('click', function (e) { step(1, 'button', e.detail === 0); });
  ['wheel', 'touchstart', 'mousedown'].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      userMoved = true;
      if (e.target && e.target.closest && e.target.closest('#dt-bar')) return;   // bar clicks must not cancel the jump in flight
      endJump();
    }, { passive: true });
  });

  /* A visible dialog inside the CURRENT section (not hidden, has a box, intersects the viewport), or null.
     Dialogs in other sections never block the presenter keys. */
  function openDialog() {
    var sec = secs[jumping && navTarget !== null ? navTarget : current];
    var list = sec.querySelectorAll(GUARD);
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      if (el.closest('[hidden]') || !el.getClientRects().length) continue;
      var r = el.getBoundingClientRect();
      if (r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth) return el;
    }
    return null;
  }
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.isComposing) return;
    var ae = document.activeElement;
    if (e.key === 'Escape') {
      if (e.target && e.target.closest && e.target.closest(GUARD)) return;   // the dialog (or its own re-dispatched Escape) handles it
      if (ae && ae.closest && ae.closest(GUARD)) return;
      var dlg = openDialog();
      if (dlg) {                                   // focus is outside the open dialog: let the section close it
        e.preventDefault();
        dlg.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        return;
      }
      if (ae && ae !== document.body) ae.blur();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var d = 0;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') d = 1;
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') d = -1;
    if (!d) return;
    var t = e.target;
    if (t && t.closest) {
      if (t.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]')) return;
      if (t.closest('[data-own-arrows]')) return;
      if (t.closest(GUARD)) return;
    }
    if (openDialog()) return;
    userMoved = true;
    e.preventDefault();                            // always: a no-op at either end must not scroll the page natively
    if (e.repeat) return;                          // one step per press, never a runaway
    step(d, 'key');
  });

  /* Links to a section (#s-...) use the same jump, so focus lands on the heading. They still work without JS. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#s-"]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var id = a.getAttribute('href').slice(1);
    var i = secs.findIndex(function (s) { return s.id === id; });
    if (i < 0) return;
    e.preventDefault();
    goTo(i, { focus: 'heading' });
  });

  window.addEventListener('scroll', function () { if (jumping) armSettle(); else update(); }, { passive: true });
  var resizeT = 0;
  window.addEventListener('resize', function () {
    resizing = true;
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      var wChanged = window.innerWidth !== lastW, hChanged = Math.abs(window.innerHeight - lastH) > 150;
      lastW = window.innerWidth; lastH = window.innerHeight;
      if (wChanged || hChanged) {   // re-anchor to the section the person was on (ignores phone toolbar nudges)
        var sec = secs[anchorIdx];
        var off = Math.min(anchorOff, Math.max(0, sec.offsetHeight - 1));
        window.scrollTo({ top: Math.max(0, (anchorIdx === 0 ? 0 : absTop(sec)) + (anchorIdx === 0 ? Math.max(0, off) : off)), behavior: 'auto' });
      }
      resizing = false;
      update();
    }, 120);
  });
  if ('ResizeObserver' in window) new ResizeObserver(update).observe(document.getElementById('main'));

  DT.sections = secs;
  DT.current = function () { return current; };
  DT.goTo = function (idOrIndex, opts) {
    var i = typeof idOrIndex === 'number' ? idOrIndex : secs.findIndex(function (s) { return s.id === idOrIndex; });
    if (i >= 0) goTo(i, opts || { focus: 'heading' });
  };

  /* A reload at #s-xx lands there instantly (no animated scroll), again once fonts settle the layout. */
  function toHash() {
    var id = location.hash.slice(1);
    var i = id ? secs.findIndex(function (s) { return s.id === id; }) : -1;
    if (i >= 0 && !userMoved) { goTo(i, { focus: false, instant: true }); }
  }
  bar.hidden = false;
  current = measure();
  render();
  toHash();
  window.addEventListener('load', function () { toHash(); update(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { toHash(); update(); });
  scheduleVisit();
})();
</script>
</body>
</html>
